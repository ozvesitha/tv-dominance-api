name: Fetch v6 Data

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Symbol (e.g. SOLUSDT)'
        required: true
        default: 'SOLUSDT'
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run v6 fetcher
        env:
          SYMBOL: ${{ github.event.inputs.symbol }}
        run: python fetch_data_v6.py

      - name: Commit data
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "Update v6 data for ${{ github.event.inputs.symbol }} [skip ci]" || echo "no changes"
          git push
