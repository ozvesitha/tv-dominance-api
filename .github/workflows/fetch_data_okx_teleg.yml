name: Fetch Data
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: |
          SYMBOL=SOLUSDT TELEGRAM_HOURS=3 python okx_fetcher.py
      - uses: actions/upload-artifact@v3
        with:
          name: data
          path: data/
