name: fetch_data_okx_teleg
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: |
          SYMBOL=SOLUSDT TELEGRAM_HOURS=3 python fetch_data_okx_teleg.py
      - uses: actions/upload-artifact@v4
        with:
          name: data
          path: data/
