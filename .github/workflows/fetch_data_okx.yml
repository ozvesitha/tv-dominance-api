name: Fetch OKX Data

on:
  workflow_dispatch:
    inputs:
      symbol:
        description: 'Symbol (e.g. SOLUSDT, ADAUSDT)'
        required: true
        default: 'SOLUSDT'
        type: string

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run OKX fetcher script
        env:
          SYMBOL: ${{ github.event.inputs.symbol }}
        run: python fetch_data_okx.py

      - name: Commit and push data
        run: |
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "Update OKX data for ${{ github.event.inputs.symbol }} [skip ci]" || echo "No changes to commit"
          git push
